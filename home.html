<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Engagement Home</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#f4f7fb; font-family:system-ui, sans-serif; padding:2rem 1.5rem; color:#1a2c3c; }
        .container { max-width:1300px; margin:0 auto; }
        h1 { font-size:1.8rem; margin-bottom:0.3rem; }
        .subtitle { color:#4b6a8e; margin-bottom:1.5rem; }
        .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
        button {
            background:#1f6e8c; color:white; border:none; padding:0.6rem 1.4rem; border-radius:2rem;
            font-weight:600; cursor:pointer; font-size:0.9rem;
        }
        button:hover { background:#175a73; }
        button.outline { background:white; color:#1f6e8c; border:1.5px solid #1f6e8c; }
        button.outline:hover { background:#e8f4f9; }
        table { width:100%; background:white; border-radius:1.2rem; border-collapse:collapse; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
        th { background:#f8fafd; font-size:0.75rem; text-transform:uppercase; color:#3e6a8c; padding:1rem; text-align:left; }
        td { padding:1rem; border-bottom:1px solid #edf2f7; font-size:0.9rem; }
        tr:last-child td { border-bottom:none; }
        tr.client-row { cursor:pointer; }
        tr.client-row:hover { background:#f8fafd; }
        .firm-name { font-weight:700; }
        .firm-meta { font-size:0.8rem; color:#64748b; }
        .phase { background:#eef2f6; padding:0.2rem 0.8rem; border-radius:2rem; font-size:0.75rem; font-weight:600; }
        .progress-wrap { display:flex; align-items:center; gap:8px; }
        .progress-bar { background:#e2e8f0; height:6px; border-radius:10px; flex:1; }
        .progress-fill { background:#1f6e8c; height:6px; border-radius:10px; }
        .action-btns { display:flex; gap:8px; }
        .icon-btn { width:32px; height:32px; border:1px solid #dce3eb; border-radius:8px; background:white; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .icon-btn:hover { background:#f1f5f9; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; z-index:1000; }
        .modal { background:white; border-radius:1.5rem; padding:2rem; width:90%; max-width:600px; max-height:90vh; overflow-y:auto; }
        .modal h3 { margin-bottom:1.5rem; }
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; font-weight:600; font-size:0.8rem; margin-bottom:0.3rem; }
        .form-group input, .form-group select { width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:0.8rem; font-size:0.95rem; background:white; }
        .form-row { display:flex; gap:1rem; }
        .form-row .form-group { flex:1; }
        .empty { text-align:center; padding:3rem; color:#64748b; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-row">
        <div>
            <h1>🏛️ Client Engagement Home</h1>
            <p class="subtitle">APAC · AI Transformation Portfolio</p>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="outline" onclick="location.reload()">🔄 Refresh</button>
            <button onclick="openAddModal()">➕ Add Client</button>
        </div>
    </div>

    <div id="clientsContainer"></div>
    <div id="emptyState" class="empty" style="display:none;">
        <h3>No clients yet</h3>
        <p>Add your first strategic relationship.</p>
    </div>
</div>

<!-- Modal -->
<div id="editModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <h3 id="modalTitle">Edit Client</h3>
        <form id="clientForm" onsubmit="saveClient(event)">
            <input type="hidden" id="editClientId">
            <div class="form-group">
                <label>Firm / Legal Department Name *</label>
                <input type="text" id="editFirmName" required placeholder="e.g., Tan & Rajah LLC">
            </div>
            <div class="form-group">
                <label>Primary Practice Area *</label>
                <select id="editPractice" required>
                    <option value="">-- Select --</option>
                    <option value="Corporate/M&A">Corporate/M&A</option>
                    <option value="Litigation">Litigation</option>
                    <option value="Regulatory/Compliance">Regulatory/Compliance</option>
                    <option value="Intellectual Property">Intellectual Property</option>
                    <option value="Employment">Employment</option>
                    <option value="Banking & Finance">Banking & Finance</option>
                    <option value="Real Estate">Real Estate</option>
                    <option value="Tax">Tax</option>
                    <option value="General">General</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Firm Size</label>
                    <select id="editSize">
                        <option value="Small">Small (1-20 lawyers)</option>
                        <option value="Mid-size" selected>Mid-size (21-100)</option>
                        <option value="Large">Large (101-500)</option>
                        <option value="Enterprise">Enterprise (500+)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Resources</label>
                    <select id="editResources">
                        <option value="Limited">Limited</option>
                        <option value="Moderate" selected>Moderate</option>
                        <option value="Abundant">Abundant</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Budget for AI</label>
                    <select id="editBudget">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tech Stack</label>
                    <input type="text" id="editTechStack" placeholder="e.g., iManage, Salesforce, Azure">
                </div>
            </div>
            <div class="form-group">
                <label>Engagement Start Date *</label>
                <input type="date" id="editEngageDate" required>
            </div>
            <div style="text-align:right; margin-top:1.5rem;">
                <button type="button" class="outline" onclick="closeModal()">Cancel</button>
                <button type="submit" style="margin-left:0.5rem;">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
    const KEY = "lid_apac_data";

    // ---- Dynamic Milestone Generator ----
    function generateTasks(client) {
        const start = client.signupDate;
        const practice = client.practice || "General";
        const size = client.size || "Mid-size";
        const resources = client.resources || "Moderate";
        const budget = client.budget || "Medium";
        const techStack = client.techStack || "Standard DMS";

        let tasks = [];
        let offset = 0;

        // 1. Welcome & Strategic Alignment (everyone)
        tasks.push({ title:"🎉 Executive Welcome & Strategic Alignment", desc:"Send personalised briefing, share AI transformation vision deck, align with partner/CIO.", phase:"Onboarding", dueOffset:offset }); offset+=3;

        // 2. Initial Assessment – tailored
        if (techStack.toLowerCase().includes("custom") || size === "Enterprise") {
            tasks.push({ title:"🧩 Advanced Tech Stack Discovery", desc:`Map AI compatibility with existing systems (${techStack}), identify integration points.`, phase:"Onboarding", dueOffset:offset }); offset+=7;
        } else {
            tasks.push({ title:"📋 AI Readiness & Workflow Survey", desc:"Assess current workflows, tech usage, and AI readiness across practice groups.", phase:"Onboarding", dueOffset:offset }); offset+=5;
        }

        // 3. Practice-specific AI opportunity workshop
        tasks.push({ title:`🎯 ${practice} AI Opportunity Workshop`, desc:"Facilitate 2-hour session with practice leaders to identify high-impact AI use cases.", phase:"Onboarding", dueOffset:offset }); offset+=14;

        // 4. Pilot / Quick win
        if (budget === "Low" || resources === "Limited") {
            tasks.push({ title:"⚡ Quick-Win Pilot", desc:`Select one high-value, low-effort ${practice} workflow for a 2-week pilot.`, phase:"Adoption", dueOffset:offset }); offset+=14;
        } else {
            tasks.push({ title:"🔬 Structured Pilot Program", desc:`Launch 3-month pilot with selected practice groups, define success metrics, assign champions.`, phase:"Adoption", dueOffset:offset }); offset+=30;
        }

        // 5. Training & Adoption support
        if (size === "Large" || size === "Enterprise") {
            tasks.push({ title:"🏫 Change Management & Training", desc:"Roll out firm-wide AI literacy programme, designate practice champions, hold workshops.", phase:"Adoption", dueOffset:offset }); offset+=21;
        } else {
            tasks.push({ title:"📚 Core AI Training for Practice Leaders", desc:"Hands-on training session for key users, develop internal playbook.", phase:"Adoption", dueOffset:offset }); offset+=14;
        }

        // 6. Integration & customisation
        if (techStack && techStack.length > 0 && techStack !== "Standard DMS") {
            tasks.push({ title:"🔗 System Integration Sprint", desc:`Connect AI platform with ${techStack} (e.g., single sign-on, document import).`, phase:"Adoption", dueOffset:offset }); offset+=14;
        }

        // 7. Adoption health check
        tasks.push({ title:"📊 AI Adoption Health Check", desc:"Review usage metrics, gather feedback, present insights to leadership.", phase:"Adoption", dueOffset:offset }); offset+=30;

        // 8. QBR
        tasks.push({ title:"📈 Executive Quarterly Business Review", desc:"Present adoption data, co-create next quarter AI strategy goals.", phase:"Expansion", dueOffset:offset }); offset+=45;

        // 9. Co-innovation lab
        tasks.push({ title:"🧪 Co-Innovation Lab", desc:"Collaborative workshop to design custom AI workflows tailored to new practice areas.", phase:"Expansion", dueOffset:offset }); offset+=60;

        // 10. Governance (for larger firms)
        if (size === "Large" || size === "Enterprise" || budget === "High") {
            tasks.push({ title:"🏛️ AI Governance Framework", desc:"Establish AI usage policy, ethical guidelines, and oversight committee.", phase:"Expansion", dueOffset:offset }); offset+=45;
        }

        // 11. Champion recognition
        tasks.push({ title:"🏆 Transformation Champion Recognition", desc:"Publicly acknowledge power users, share internal case study.", phase:"Expansion", dueOffset:offset }); offset+=30;

        // 12. Annual strategy summit
        tasks.push({ title:"🌟 Annual AI Strategy Summit", desc:"Full-day review of transformation journey and 12-month roadmap.", phase:"Annual Summit", dueOffset:offset }); offset+=90;

        // Convert offsets to actual dates
        tasks.forEach((t, i) => {
            let d = new Date(start);
            d.setDate(d.getDate() + t.dueOffset);
            t.dueDate = d.toISOString().split('T')[0];
            t.id = `t${Date.now()}_${i}`;
            t.completed = false;
            t.description = t.desc || t.title;
            t.category = t.phase;
        });

        return tasks;
    }

    // ---- Data management ----
    function getFirms() { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
    function saveFirms(firms) { localStorage.setItem(KEY, JSON.stringify(firms)); }

    function render() {
        let firms = getFirms();
        let cont = document.getElementById('clientsContainer');
        let empty = document.getElementById('emptyState');
        if(!firms.length) { cont.innerHTML=''; empty.style.display='block'; return; }
        empty.style.display='none';

        let html = `<table><thead><tr><th>Client</th><th>Details</th><th>Progress</th><th>Next Action</th><th></th></tr></thead><tbody>`;
        firms.forEach(f => {
            let tasks = f.tasks || [];
            let done = tasks.filter(t=>t.completed).length;
            let total = tasks.length;
            let pct = total ? Math.round((done/total)*100) : 0;
            let next = tasks.find(t=>!t.completed);
            let phase = next ? next.category : (total ? 'Strategic Partner' : 'Onboarding');
            let nextText = next ? `${next.title} (${fmtDate(next.dueDate)})` : 'All complete ✨';
            let detail = `${f.size || 'N/A'} · ${f.practice || 'General'} · ${f.techStack || 'Std tech'}`;
            html += `<tr class="client-row" onclick="window.location.href='detail.html?id=${f.id}'">
                <td><div class="firm-name">${esc(f.name)}</div></td>
                <td><div class="firm-meta">${esc(detail)}</div></td>
                <td><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><span style="font-size:0.8rem; margin-left:8px;">${pct}%</span></div></td>
                <td style="max-width:200px; font-size:0.8rem;">${nextText}</td>
                <td><div class="action-btns" onclick="event.stopPropagation();">
                    <button class="icon-btn" onclick="event.stopPropagation();editFirm('${f.id}')">✏️</button>
                    <button class="icon-btn" onclick="event.stopPropagation();delFirm('${f.id}')" style="color:#dc2626;">🗑️</button>
                </div></td>
            </tr>`;
        });
        html += '</tbody></table>';
        cont.innerHTML = html;
    }

    function fmtDate(d) { return d ? new Date(d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}) : ''; }
    function esc(s) { return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

    function editFirm(id) {
        let firm = getFirms().find(f=>f.id===id); if(!firm) return;
        document.getElementById('editClientId').value = firm.id;
        document.getElementById('editFirmName').value = firm.name;
        document.getElementById('editPractice').value = firm.practice || 'General';
        document.getElementById('editSize').value = firm.size || 'Mid-size';
        document.getElementById('editResources').value = firm.resources || 'Moderate';
        document.getElementById('editBudget').value = firm.budget || 'Medium';
        document.getElementById('editTechStack').value = firm.techStack || '';
        document.getElementById('editEngageDate').value = firm.signupDate;
        document.getElementById('modalTitle').textContent = 'Edit Client';
        document.getElementById('editModal').style.display = 'flex';
    }

    function openAddModal() {
        document.getElementById('editClientId').value = '';
        document.getElementById('editFirmName').value = '';
        document.getElementById('editPractice').value = 'Corporate/M&A';
        document.getElementById('editSize').value = 'Mid-size';
        document.getElementById('editResources').value = 'Moderate';
        document.getElementById('editBudget').value = 'Medium';
        document.getElementById('editTechStack').value = '';
        document.getElementById('editEngageDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('modalTitle').textContent = 'Add Client';
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }

    function saveClient(e) {
        e.preventDefault();
        let id = document.getElementById('editClientId').value;
        let name = document.getElementById('editFirmName').value.trim();
        let practice = document.getElementById('editPractice').value;
        let size = document.getElementById('editSize').value;
        let resources = document.getElementById('editResources').value;
        let budget = document.getElementById('editBudget').value;
        let techStack = document.getElementById('editTechStack').value.trim();
        let date = document.getElementById('editEngageDate').value;
        if(!name || !date) { alert('Name and date required'); return; }
        let firms = getFirms();
        let client = { name, practice, size, resources, budget, techStack, signupDate: date };
        if(id) {
            let firm = firms.find(f=>f.id===id);
            if(firm) {
                Object.assign(firm, client);
                firm.tasks = generateTasks(firm);
            }
        } else {
            let newId = 'c'+Date.now()+Math.random().toString(36).substr(2,4);
            client.id = newId;
            client.tasks = generateTasks(client);
            firms.push(client);
        }
        saveFirms(firms);
        closeModal();
        render();
    }

    function delFirm(id) {
        if(!confirm('Remove this client?')) return;
        let firms = getFirms().filter(f=>f.id!==id);
        saveFirms(firms);
        render();
    }

    window.onclick = function(e) { if(e.target === document.getElementById('editModal')) closeModal(); };
    window.editFirm = editFirm;
    window.delFirm = delFirm;
    window.openAddModal = openAddModal;
    window.closeModal = closeModal;

    document.addEventListener('DOMContentLoaded', ()=>{
        if(!getFirms().length) {
            // seed demo with tailored milestones
            let demo = {
                id: 'demo1',
                name: 'Tan & Rajah LLC',
                practice: 'Corporate/M&A',
                size: 'Mid-size',
                resources: 'Moderate',
                budget: 'Medium',
                techStack: 'iManage, Salesforce',
                signupDate: '2026-05-01'
            };
            demo.tasks = generateTasks(demo);
            saveFirms([demo]);
        }
        render();
    });
</script>
</body>
</html>
